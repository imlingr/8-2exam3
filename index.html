            }, [activeTab]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const handleSelect = (qId, idx, isCorrect) => {
                if (activeTab === 'review') {
                    setReviewAnswers(prev => ({ ...prev, [qId]: idx }));
                } else {
                    setAnswers(prev => ({ ...prev, [qId]: idx }));
                    if (!isCorrect) {
                        setWrongIds(prev => prev.includes(qId) ? prev : [...prev, qId]);
                    }
                }
            };

            const resetReview = () => {
                setReviewAnswers({});
            };

            const handleSaveRecord = () => {
                const answeredCount = Object.keys(answers).length;
                if (answeredCount === 0) {
                    showToast("目前還沒有作答紀錄可以存檔喔！");
                    return;
                }
                const correctCount = answeredCount - wrongIds.length;
                const newRecord = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString('zh-TW'),
                    attempt: records.length + 1,
                    totalAnswered: answeredCount,
                    correctCount: correctCount,
                    wrongCount: wrongIds.length,
                    wrongIds: [...wrongIds]
                };
                setRecords([...records, newRecord]);
                showToast(`✅ 已存檔！第 ${newRecord.attempt} 次作答紀錄保存成功。`);
            };

            const handleExport = (type) => {
                if (wrongIds.length === 0) {
                    showToast("🎉 太棒了！目前沒有錯題，不需要匯出！");
                    return;
                }
                
                const wrongQs = questions.filter(q => wrongIds.includes(q.id));
                const baseURI = window.location.href.split('?')[0].split('#')[0].replace(/\/[^\/]*$/, '/');
                
                let htmlContent = `
                    <!DOCTYPE html>
                    <html lang="zh-TW">
                    <head>
                        <meta charset="UTF-8">
                        <title>錯題匯出 - 魔法補考大挑戰</title>
                        <base href="${baseURI}">
                        <style>
                            body { font-family: 'Noto Sans TC', sans-serif; line-height: 1.6; padding: 20px; color: #333; max-width: 800px; margin: 0 auto; }
                            h1 { text-align: center; color: #0d9488; }
                            .meta-info { text-align: center; color: #666; margin-bottom: 30px; }
                            .question-card { border: 2px solid #e5e7eb; padding: 20px; margin-bottom: 25px; border-radius: 12px; page-break-inside: avoid; }
                            .q-title { font-weight: bold; font-size: 1.3em; color: #0f766e; margin-bottom: 15px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
                            .q-img { max-width: 100%; max-height: 250px; display: block; margin: 15px auto; border: 1px solid #ccc; }
                            .options { margin-bottom: 20px; }
                            .option { padding: 8px 12px; margin-bottom: 5px; border-radius: 6px; background-color: #f9fafb; }
                            .correct { color: #16a34a; font-weight: bold; background-color: #f0fdf4; border: 1px solid #bbf7d0; }
                            .explanation { background: #fffbeb; padding: 15px; border-radius: 8px; border-left: 5px solid #f59e0b; }
                            .exp-title { font-weight: bold; color: #d97706; margin-bottom: 8px; }
                            @media print {
                                body { padding: 0; }
                                .question-card { border: 1px solid #999; page-break-inside: avoid; box-shadow: none; }
                            }
                        </style>
                    </head>
                    <body>
                        <h1>🌟 八下理化：魔法補考大挑戰3 🌟</h1>
                        <div class="meta-info">匯出時間：${new Date().toLocaleString('zh-TW')} | 總錯題數：${wrongQs.length} 題</div>
                `;

                wrongQs.forEach(q => {
                    htmlContent += `
                        <div class="question-card">
                            <div class="q-title">第 ${q.id} 題</div>
                            <div>${q.q}</div>
                            ${q.img ? `<img class="q-img" src="${q.img}" />` : ''}
                            <div class="options">
                                ${q.opts.map((opt, idx) => `
                                    <div class="option ${idx === q.ans ? 'correct' : ''}">
                                        ${idx === q.ans ? '✅ ' : '⬜ '}${opt}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="explanation">
                                <div class="exp-title">✨ 觀念大補帖：</div>
                                <div>${q.exp}</div>
                            </div>
                        </div>
                    `;
                });
                htmlContent += `</body></html>`;

                if (type === 'html') {
                    const blob = new Blob([htmlContent], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `魔法理化_錯題本_${new Date().getTime()}.html`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast("⬇️ HTML 檔案已下載！");
                } else if (type === 'pdf') {
                    // 保護措施：處理被瀏覽器攔截彈出視窗的情況
                    const printWindow = window.open('', '_blank');
                    if (printWindow) {
                        printWindow.document.write(htmlContent);
                        printWindow.document.close();
                        printWindow.onload = function() {
                            printWindow.focus();
                            printWindow.print();
                        };
                    } else {
                        showToast("❌ 無法開啟列印視窗，請允許瀏覽器彈出視窗！");
                    }
                }
            };

            const handleResetOption = (option) => {
                if (option === 1) setResetStep(1);
                else if (option === 2) setResetStep(2);
                else {
                    setShowResetModal(false);
                    setResetStep(0);
                }
            };

            const executeReset = () => {
                if (resetStep === 1) {
                    setAnswers({});
                    setWrongIds([]); // 重大修正：原先為 {}，會導致後續使用陣列方法 (.length 或 .includes) 時整個畫面崩潰！
                    setReviewAnswers({});
                    safeRemoveItem('magic_exam_progress_answers');
                    safeRemoveItem('magic_exam_progress_wrongIds');
                    showToast("🗑️ 已刪除此次作答紀錄！");
                } else if (resetStep === 2) {
                    setAnswers({});
                    setWrongIds([]); // 重大修正：確保它是陣列
                    setReviewAnswers({});
                    setRecords([]);
                    safeClear();
                    showToast("💥 已清空本機所有作答與存檔紀錄！");
                }
                setShowResetModal(false);
                setResetStep(0);
            };

            let currentQuestions = [];
            if (activeTab === 'part1') currentQuestions = questions.filter(q => q.part === 1);
            else if (activeTab === 'part2') currentQuestions = questions.filter(q => q.part === 2);
            else if (activeTab === 'review') currentQuestions = questions.filter(q => wrongIds.includes(q.id));

            return (
                <div className="min-h-screen pb-20 relative">
                    <Header />

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 toast-enter">
                            <div className="bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl font-bold flex items-center gap-3">
                                {toastMessage}
                            </div>
                        </div>
                    )}

                    {showResetModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl">
                                {resetStep === 0 ? (
                                    <>
                                        <h3 className="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                                            <i className="fas fa-triangle-exclamation text-rose-500"></i> 砍掉重練
                                        </h3>
                                        <p className="text-gray-500 mb-6 font-medium">請選擇您想要清除的紀錄範圍：</p>
                                        <div className="space-y-3">
                                            <button onClick={() => handleResetOption(1)} className="w-full text-left px-5 py-4 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-700 font-bold border border-orange-200 transition-colors shadow-sm bouncy">
                                                ① 僅刪除此次作答紀錄
                                            </button>
                                            <button onClick={() => handleResetOption(2)} className="w-full text-left px-5 py-4 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold border border-rose-200 transition-colors shadow-sm bouncy">
                                                ② 刪除本機所有紀錄<br/><span className="text-sm font-normal text-rose-500">(包含手動保存的歷史存檔)</span>
                                            </button>
                                            <button onClick={() => handleResetOption(3)} className="w-full text-left px-5 py-4 rounded-xl bg-gray-50 hover:bg-gray-100 text-gray-700 font-bold border border-gray-200 transition-colors shadow-sm bouncy">
                                                ③ 算了，不要刪了
                                            </button>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <h3 className="text-2xl font-bold text-rose-600 mb-4">
                                            <i className="fas fa-circle-question mr-2"></i>再次確認
                                        </h3>
                                        <p className="text-gray-700 mb-8 font-medium leading-relaxed">
                                            {resetStep === 1 
                                                ? "確定要刪除「此次作答紀錄」嗎？\n(已手動保存的歷史紀錄不會被刪除喔！)" 
                                                : "確定要刪除「本機所有紀錄」嗎？\n(包含所有已存檔的歷史紀錄，此動作無法復原！)"}
                                        </p>
                                        <div className="flex gap-3">
                                            <button onClick={() => {setShowResetModal(false); setResetStep(0);}} className="flex-1 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold transition-colors bouncy">
                                                取消
                                            </button>
                                            <button onClick={executeReset} className="flex-1 py-3 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold transition-colors shadow-md bouncy">
                                                確定刪除
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                    
                    <div className="max-w-3xl mx-auto px-4 mb-6 flex flex-wrap gap-2 md:gap-3 justify-center">
                        <button onClick={handleSaveRecord} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold text-sm md:text-base bg-indigo-50 text-indigo-700 border-2 border-indigo-200 hover:bg-indigo-100 transition-colors shadow-sm bouncy flex items-center justify-center gap-2">
                            <i className="fas fa-save"></i> 紀錄存檔
                        </button>
                        <button onClick={() => handleExport('html')} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold text-sm md:text-base bg-blue-50 text-blue-700 border-2 border-blue-200 hover:bg-blue-100 transition-colors shadow-sm bouncy flex items-center justify-center gap-2">
                            <i className="fas fa-download"></i> 匯出 (HTML)
                        </button>
                        <button onClick={() => handleExport('pdf')} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold text-sm md:text-base bg-emerald-50 text-emerald-700 border-2 border-emerald-200 hover:bg-emerald-100 transition-colors shadow-sm bouncy flex items-center justify-center gap-2">
                            <i className="fas fa-print"></i> 列印 / PDF
                        </button>
                        <button onClick={() => {setShowResetModal(true); setResetStep(0);}} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold text-sm md:text-base bg-rose-50 text-rose-700 border-2 border-rose-200 hover:bg-rose-100 transition-colors shadow-sm bouncy flex items-center justify-center gap-2">
                            <i className="fas fa-trash-can"></i> 砍掉重練
                        </button>
                    </div>

                    <div className="max-w-3xl mx-auto px-4 mb-8 flex flex-wrap gap-3">
                        <button 
                            onClick={() => setActiveTab('part1')}
                            className={`flex-1 min-w-[100px] py-3 px-2 md:px-4 rounded-2xl font-bold text-sm md:text-lg transition-all duration-300 shadow-sm ${activeTab === 'part1' ? 'bg-teal-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-teal-50'}`}
                        >
                            第一部份
                        </button>
                        <button 
                            onClick={() => setActiveTab('part2')}
                            className={`flex-1 min-w-[100px] py-3 px-2 md:px-4 rounded-2xl font-bold text-sm md:text-lg transition-all duration-300 shadow-sm ${activeTab === 'part2' ? 'bg-teal-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-teal-50'}`}
                        >
                            第二部份
                        </button>
                        <button 
                            onClick={() => setActiveTab('review')}
                            className={`flex-1 min-w-[100px] py-3 px-2 md:px-4 rounded-2xl font-bold text-sm md:text-lg transition-all duration-300 shadow-sm relative ${activeTab === 'review' ? 'bg-rose-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-rose-50'}`}
                        >
                            錯題複習
                            {Array.isArray(wrongIds) && wrongIds.length > 0 && (
                                <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2 py-1 rounded-full shadow-md animate-bounce">
                                    {wrongIds.length}
                                </span>
                            )}
                        </button>
                        <button 
                            onClick={() => setActiveTab('history')}
                            className={`flex-1 min-w-[100px] py-3 px-2 md:px-4 rounded-2xl font-bold text-sm md:text-lg transition-all duration-300 shadow-sm ${activeTab === 'history' ? 'bg-indigo-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-indigo-50'}`}
                        >
                            歷史紀錄
                        </button>
                    </div>

                    {activeTab === 'history' ? (
                        <div className="px-4 max-w-3xl mx-auto fade-in">
                            <h2 className="text-xl font-bold text-indigo-700 mb-6 flex items-center">
                                <i className="fas fa-clock-rotate-left mr-2"></i>我的存檔紀錄
                            </h2>
                            {records.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-3xl shadow-sm border border-gray-100">
                                    <div className="text-5xl mb-4 opacity-50">📂</div>
                                    <p className="text-gray-500 font-medium">目前還沒有任何存檔紀錄喔！<br/>去挑戰一下，然後按下「紀錄存檔」吧！</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {[...records].reverse().map((record, i) => (
                                        <div key={record.id} className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4 border-l-4 border-l-indigo-500">
                                            <div>
                                                <div className="text-xs text-gray-400 font-bold mb-1">
                                                    {record.timestamp}
                                                </div>
                                                <div className="font-extrabold text-lg text-gray-800 mb-1">
                                                    第 {record.attempt} 次挑戰紀錄
                                                </div>
                                                <div className="text-sm font-medium text-gray-600">
                                                    作答：{record.totalAnswered} 題 
                                                    <span className="mx-2">|</span> 
                                                    <span className="text-green-600">答對：{record.correctCount} 題</span>
                                                    <span className="mx-2">|</span> 
                                                    <span className="text-rose-500">答錯：{record.wrongCount} 題</span>
                                                </div>
                                            </div>
                                            {record.wrongIds && record.wrongIds.length > 0 && (
                                                <div className="bg-rose-50 text-rose-700 px-4 py-2 rounded-xl text-sm font-bold flex-shrink-0">
                                                    錯題：{record.wrongIds.join(', ')}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    ) : activeTab === 'review' && wrongIds.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-3xl shadow-sm border border-gray-100 max-w-3xl mx-auto px-4 fade-in">
                            <div className="text-6xl mb-4">🌟</div>
                            <h2 className="text-2xl md:text-3xl font-bold text-teal-600 mb-2">太棒了！目前沒有錯題喔！</h2>
                            <p className="text-gray-500 text-lg">繼續保持，你是理化小天才！</p>
                        </div>
                    ) : (
                        <div className="px-4">
                            {activeTab === 'review' && (
                                <div className="max-w-3xl mx-auto mb-6 flex justify-between items-center fade-in">
                                    <h2 className="text-xl font-bold text-rose-600">
                                        <i className="fas fa-fire mr-2"></i>錯題特訓區
                                    </h2>
                                    <button 
                                        onClick={resetReview}
                                        className="px-4 py-2 bg-rose-100 text-rose-700 rounded-full font-bold hover:bg-rose-200 transition-colors text-sm shadow-sm bouncy"
                                    >
                                        <i className="fas fa-redo mr-1"></i> 重新測驗
                                    </button>
                                </div>
                            )}
                            
                            {currentQuestions.map((q, idx) => (
                                <QuestionCard 
                                    key={`${activeTab}-${q.id}`} 
                                    item={q} 
                                    index={idx} 
                                    selectedIdx={activeTab === 'review' ? reviewAnswers[q.id] : answers[q.id]}
                                    onSelect={handleSelect}
                                    isReviewMode={activeTab === 'review'}
                                />
                            ))}
                        </div>
                    )}

                    <div className="text-center mt-12 text-gray-400 font-medium pb-8">
                        <p>勇敢挑戰，理化一點都不難！💪</p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
